<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kids Reels (Ages 2–8)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #101828; color: #fff; min-height: 100vh; display: flex; justify-content: center; }
    .app { width: 100%; max-width: 440px; min-height: 100vh; display: flex; flex-direction: column; padding: 16px; gap: 14px; }
    .top-bar { display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #1d2939; padding: 8px 12px; border-radius: 999px; font-size: 13px; }
    .btn { border: none; border-radius: 18px; padding: 14px 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: #22c55e; color: #052e16; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-calm { background: #38bdf8; color: #082f49; }
    .age-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .age-card { background: #1e293b; border: 2px solid #334155; border-radius: 20px; padding: 18px 14px; text-align: center; cursor: pointer; }
    .age-card.active { border-color: #22c55e; background: #14532d; }
    .age-emoji { font-size: 32px; display: block; margin-bottom: 6px; }
    .topic-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
    .topic-chip { flex: 0 0 auto; background: #1e293b; color: #e2e8f0; border: 1px solid #475569; border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer; }
    .topic-chip.active { background: #facc15; color: #1e293b; border-color: #facc15; font-weight: 700; }
    .stage { position: relative; flex: 1; min-height: 420px; background: #000; border-radius: 24px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    .overlay-title { position: absolute; left: 14px; right: 14px; bottom: 14px; background: rgba(15, 23, 42, 0.78); padding: 12px 14px; border-radius: 16px; font-size: 16px; font-weight: 700; }
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.92); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 20; }
    .modal.open { display: flex; }
    .modal-box { width: 100%; max-width: 380px; background: #1e293b; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
    input, select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 15px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="app">
    <div class="top-bar">
      <div class="badge" id="sessionBadge">Reel 0 / 6</div>
      <button class="btn btn-secondary" style="padding: 8px 14px; font-size: 14px;" onclick="openParentGate()">🔒 Parents</button>
    </div>

    <div class="age-grid">
      <div class="age-card active" id="tier-2-5" onclick="setAgeTier('2-5')">
        <span class="age-emoji">🐣</span>
        <div><strong>Little Explorers</strong></div>
        <div style="font-size: 13px; opacity: 0.85;">Ages 2–5</div>
      </div>
      <div class="age-card" id="tier-6-8" onclick="setAgeTier('6-8')">
        <span class="age-emoji">🚀</span>
        <div><strong>Curious Kids</strong></div>
        <div style="font-size: 13px; opacity: 0.85;">Ages 6–8</div>
      </div>
    </div>

    <div class="topic-row" id="topicRow"></div>

    <div class="stage" id="playerStage">
      <video id="reelVideo" playsinline controls preload="auto"></video>
      <div class="overlay-title" id="reelTitle">Loading reels...</div>
    </div>

    <div class="stage hidden" id="breakStage" style="flex-direction: column; gap: 14px; padding: 24px; text-align: center; background: #1e293b;">
      <div style="font-size: 48px;">🌟</div>
      <h2>All Done for Now!</h2>
      <p style="opacity: 0.9;">Great watching! Time to stretch, draw, or ask a grown-up for another round.</p>
      <button class="btn btn-primary" onclick="openParentGate()">Parent Unlock for More</button>
    </div>

    <div class="controls">
      <button class="btn btn-secondary" onclick="prevReel()">⬅️ Back</button>
      <button class="btn btn-calm" onclick="replayReel()">🔁 Replay</button>
      <button class="btn btn-primary" onclick="nextReel()">Next ➡️</button>
    </div>
  </div>

  <!-- Parent Gate & Settings Modal -->
  <div class="modal" id="parentModal">
    <div class="modal-box" id="gateStep">
      <h3>Parent Check</h3>
      <p id="mathPrompt" style="font-size: 18px; font-weight: 700;"></p>
      <input type="number" id="mathAnswer" placeholder="Enter answer" />
      <div style="display: flex; gap: 10px;">
        <button class="btn btn-secondary" style="flex:1;" onclick="closeParentModal()">Cancel</button>
        <button class="btn btn-primary" style="flex:1;" onclick="verifyMath()">Unlock</button>
      </div>
    </div>

    <div class="modal-box hidden" id="settingsStep">
      <h3>Parent Controls</h3>
      <label style="font-size: 14px;">Max reels per session:
        <select id="sessionLimitSelect" style="margin-top: 6px;">
          <option value="4">4 reels (Short)</option>
          <option value="6" selected>6 reels (Default)</option>
          <option value="8">8 reels</option>
          <option value="12">12 reels</option>
        </select>
      </label>
      <button class="btn btn-calm" onclick="startFreshSession()">Start New Session</button>
      <button class="btn btn-primary" onclick="saveParentSettings()">Save & Close</button>
    </div>
  </div>

  <script>
    const FALLBACK_DATA = {
      reels: [
        {
          id: "sample-1",
          title: "Big Blue Whale (Sample Clip)",
          video_url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
          age_min: 2,
          age_max: 8,
          topic: "animals",
          is_active: true
        },
        {
          id: "sample-2",
          title: "Tiny Space Adventure (Sample Clip)",
          video_url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
          age_min: 5,
          age_max: 8,
          topic: "science",
          is_active: true
        }
      ]
    };

    let allReels = [];
    let filteredReels = [];
    let currentIndex = 0;
    let watchedInSession = 0;
    let sessionLimit = 6;
    let ageTier = "2-5";
    let selectedTopic = "all";
    let expectedAnswer = 0;

    const videoEl = document.getElementById("reelVideo");
    const titleEl = document.getElementById("reelTitle");
    const badgeEl = document.getElementById("sessionBadge");

    async function loadCatalog() {
      try {
        const res = await fetch("./catalog/reels.json?t=" + Date.now());
        if (!res.ok) throw new Error("No catalog");
        const data = await res.json();
        const valid = (data.reels || []).filter(r => r.is_active !== false && r.video_url && !r.video_url.includes("your-r2-domain.example"));
        allReels = valid.length ? valid : FALLBACK_DATA.reels;
      } catch {
        allReels = FALLBACK_DATA.reels;
      }
      renderTopics();
      applyFilters();
    }

    function renderTopics() {
      const topics = ["all", ...new Set(allReels.map(r => r.topic || "general"))];
      const row = document.getElementById("topicRow");
      row.innerHTML = "";
      topics.forEach(t => {
        const chip = document.createElement("button");
        chip.className = "topic-chip" + (t === selectedTopic ? " active" : "");
        chip.textContent = t === "all" ? "✨ All Topics" : `🎬 ${t[0].toUpperCase() + t.slice(1)}`;
        chip.onclick = () => { selectedTopic = t; renderTopics(); applyFilters(); };
        row.appendChild(chip);
      });
    }

    function setAgeTier(tier) {
      ageTier = tier;
      document.getElementById("tier-2-5").classList.toggle("active", tier === "2-5");
      document.getElementById("tier-6-8").classList.toggle("active", tier === "6-8");
      if (tier === "2-5" && sessionLimit > 6) sessionLimit = 6;
      if (tier === "6-8" && sessionLimit < 8) sessionLimit = 8;
      document.getElementById("sessionLimitSelect").value = String(sessionLimit);
      applyFilters();
    }

    function applyFilters() {
      const [minA, maxA] = ageTier === "2-5" ? [2, 5] : [6, 8];
      filteredReels = allReels.filter(r => {
        const rMin = Number(r.age_min ?? 2);
        const rMax = Number(r.age_max ?? 8);
        const ageMatch = rMin <= maxA && rMax >= minA;
        const topicMatch = selectedTopic === "all" || r.topic === selectedTopic;
        return ageMatch && topicMatch;
      });
      if (!filteredReels.length) filteredReels = allReels;
      currentIndex = 0;
      loadCurrentReel(false);
    }

    function loadCurrentReel(countAsWatched = true) {
      if (countAsWatched) watchedInSession += 1;
      updateBadge();

      if (watchedInSession >= sessionLimit) {
        document.getElementById("playerStage").classList.add("hidden");
        document.getElementById("breakStage").classList.remove("hidden");
        videoEl.pause();
        return;
      }

      document.getElementById("breakStage").classList.add("hidden");
      document.getElementById("playerStage").classList.remove("hidden");

      const reel = filteredReels[currentIndex % filteredReels.length];
      titleEl.textContent = reel.title || "Kids Reel";
      videoEl.src = reel.video_url;
      videoEl.load();
    }

    function updateBadge() {
      const shown = Math.min(watchedInSession + 1, sessionLimit);
      badgeEl.textContent = `Reel ${shown} / ${sessionLimit}`;
    }

    function nextReel() {
      currentIndex = (currentIndex + 1) % filteredReels.length;
      loadCurrentReel(true);
    }

    function prevReel() {
      currentIndex = (currentIndex - 1 + filteredReels.length) % filteredReels.length;
      loadCurrentReel(false);
    }

    function replayReel() {
      videoEl.currentTime = 0;
      videoEl.play().catch(() => {});
    }

    function openParentGate() {
      const a = Math.floor(Math.random() * 8) + 6;
      const b = Math.floor(Math.random() * 7) + 4;
      expectedAnswer = a + b;
      document.getElementById("mathPrompt").textContent = `What is ${a} + ${b}?`;
      document.getElementById("mathAnswer").value = "";
      document.getElementById("gateStep").classList.remove("hidden");
      document.getElementById("settingsStep").classList.add("hidden");
      document.getElementById("parentModal").classList.add("open");
    }

    function closeParentModal() {
      document.getElementById("parentModal").classList.remove("open");
    }

    function verifyMath() {
      const val = Number(document.getElementById("mathAnswer").value);
      if (val === expectedAnswer) {
        document.getElementById("gateStep").classList.add("hidden");
        document.getElementById("settingsStep").classList.remove("hidden");
      } else {
        alert("Try again!");
      }
    }

    function startFreshSession() {
      watchedInSession = 0;
      sessionLimit = Number(document.getElementById("sessionLimitSelect").value);
      closeParentModal();
      loadCurrentReel(false);
    }

    function saveParentSettings() {
      sessionLimit = Number(document.getElementById("sessionLimitSelect").value);
      closeParentModal();
      updateBadge();
    }

    loadCatalog();
  </script>
</body>
</html>
